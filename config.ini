[App]
name=NeuraFlow Bridge
debugMode=false

[Device]
autoConnectOnStartup=false

[BridgeApi]
webUrl=http://localhost:3000
apiUrl=http://localhost:4000
authStartPath=/bridge/auth/start
authTokenPath=/api/v1/bridge/auth/token
devicesPath=/api/v1/bridge/devices
streamWsUrl=ws://localhost:4000/api/v1/bridge/stream

[BridgeAuth]
codeTtlSeconds=120
tokenTtlSeconds=86400
allowedClientIds=cyton_bridge
oneTimeCode=true

[DeepLink]
protocol=cyton-bridge
action=connect
clientIdKey=clientId
redirectUriKey=redirectUri
stateKey=state
callbackPort=8787
